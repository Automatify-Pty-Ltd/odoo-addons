name: Odoo 19 Social LinkedIn Debug

on:
  push:
    branches:
      - feature/social-publisher-stage1

permissions:
  contents: read

concurrency:
  group: odoo19-social-linkedin-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  ODOO_IMAGE: odoo:19.0-20260908
  POSTGRES_IMAGE: postgres:16.15

jobs:
  linkedin:
    name: Install and test LinkedIn on Odoo 19
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out addon repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build pinned Odoo 19 test image
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/.github/requirements-ci.txt" "$RUNNER_TEMP/requirements-ci.txt"
          cat > "$RUNNER_TEMP/Dockerfile.odoo-ci" <<EOF
          FROM ${ODOO_IMAGE}
          USER root
          COPY requirements-ci.txt /tmp/requirements-ci.txt
          RUN pip3 install --no-cache-dir --break-system-packages --require-hashes -r /tmp/requirements-ci.txt
          USER odoo
          EOF
          docker build \
            --file "$RUNNER_TEMP/Dockerfile.odoo-ci" \
            --tag automatify-odoo19-ci \
            "$RUNNER_TEMP"

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create odoo19-ci-linkedin-debug
          docker run --detach --rm \
            --name db-linkedin-debug \
            --network odoo19-ci-linkedin-debug \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_USER=odoo \
            --env POSTGRES_PASSWORD=odoo \
            "$POSTGRES_IMAGE"

          for attempt in $(seq 1 60); do
            if docker exec db-linkedin-debug pg_isready -U odoo -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs db-linkedin-debug
          exit 1

      - name: Install Social Publisher LinkedIn and run tests with captured output
        id: linkedin_test
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/odoo19-social-linkedin.log"
          set +e
          docker run --rm \
            --name odoo19-ci-social-linkedin-debug \
            --network odoo19-ci-linkedin-debug \
            --volume "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            automatify-odoo19-ci \
            odoo \
            --database=odoo19_ci_social_linkedin_debug \
            --without-demo=true \
            --http-interface=127.0.0.1 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --init=automatify_social_linkedin \
            --test-tags=/automatify_social_linkedin \
            --stop-after-init \
            --log-level=test \
            2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 ]]; then
            echo "::group::LinkedIn Odoo failure tail"
            tail -n 400 "$LOG" || true
            echo "::endgroup::"
            first_error="$(grep -E 'Traceback|ERROR|CRITICAL|FAIL|AssertionError|ParseError|ImportError|ModuleNotFoundError|AttributeError|UserError' "$LOG" | tail -n 1 || true)"
            if [[ -n "$first_error" ]]; then
              first_error="${first_error//'%'/'%25'}"
              first_error="${first_error//$'\r'/'%0D'}"
              first_error="${first_error//$'\n'/'%0A'}"
              echo "::error title=LinkedIn Odoo test failed::$first_error"
            fi
            exit "$status"
          fi

      - name: Show database logs on failure
        if: failure()
        shell: bash
        run: docker logs db-linkedin-debug || true

      - name: Clean up
        if: always()
        shell: bash
        run: |
          docker rm --force db-linkedin-debug 2>/dev/null || true
          docker network rm odoo19-ci-linkedin-debug 2>/dev/null || true
