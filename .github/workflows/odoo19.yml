name: Odoo 19

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: odoo19-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OCA_KNOWLEDGE_COMMIT: e4a12c0c99866a5850840941d6f7ae3b3b27280d
  ODOO_IMAGE: odoo:19.0-20260908
  POSTGRES_IMAGE: postgres:16.15

jobs:
  test:
    name: Install and test on Odoo 19
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out addon repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate public Social Publisher hygiene
        shell: bash
        run: |
          set -euo pipefail
          modules=(automatify_social automatify_social_linkedin automatify_social_x)
          for module in "${modules[@]}"; do
            test -d "$module"
          done

          bad_files="$(find "${modules[@]}" -type f \( \
            -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o \
            -name '*.p12' -o -name '*.pfx' -o -name 'secrets.*' \
          \) -print)"
          if [[ -n "$bad_files" ]]; then
            echo "Secret-looking files are not allowed in public addon source:"
            echo "$bad_files"
            exit 1
          fi

          if grep -RInE \
            'odoo_demo|odoo_prod|odoo-demo\.automatify\.com\.au|odoo\.automatify\.com\.au|Raspberry Pi|RP5|DEPLOY_ENABLED|Automatify Social Publisher|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]+' \
            "${modules[@]}"; then
            echo "Internal environment marker or secret-like value found in public addon source."
            exit 1
          fi

      - name: Fetch pinned OCA Knowledge revision
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/oca-knowledge"
          git -C "$RUNNER_TEMP/oca-knowledge" remote add origin https://github.com/OCA/knowledge.git
          git -C "$RUNNER_TEMP/oca-knowledge" fetch --depth 1 origin "$OCA_KNOWLEDGE_COMMIT"
          git -C "$RUNNER_TEMP/oca-knowledge" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/oca-knowledge" rev-parse HEAD)" = "$OCA_KNOWLEDGE_COMMIT"

      - name: Build pinned Odoo 19 test image
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/.github/requirements-ci.txt" "$RUNNER_TEMP/requirements-ci.txt"
          cat > "$RUNNER_TEMP/Dockerfile.odoo-ci" <<EOF
          FROM ${ODOO_IMAGE}
          USER root
          COPY requirements-ci.txt /tmp/requirements-ci.txt
          RUN pip3 install --no-cache-dir --break-system-packages --require-hashes -r /tmp/requirements-ci.txt
          USER odoo
          EOF
          docker build \
            --file "$RUNNER_TEMP/Dockerfile.odoo-ci" \
            --tag automatify-odoo19-ci \
            "$RUNNER_TEMP"

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create odoo19-ci
          docker run --detach --rm \
            --name db \
            --network odoo19-ci \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_USER=odoo \
            --env POSTGRES_PASSWORD=odoo \
            "$POSTGRES_IMAGE"

          for attempt in $(seq 1 60); do
            if docker exec db pg_isready -U odoo -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs db
          exit 1

      - name: Install Knowledge Markdown and run tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --name odoo19-ci-knowledge \
            --network odoo19-ci \
            --volume "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            --volume "$RUNNER_TEMP/oca-knowledge:/mnt/oca-knowledge:ro" \
            automatify-odoo19-ci \
            odoo \
            --database=odoo19_ci_knowledge \
            --without-demo=true \
            --http-interface=127.0.0.1 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/oca-knowledge,/mnt/extra-addons \
            --init=knowledge_markdown \
            --test-tags=/knowledge_markdown \
            --stop-after-init \
            --log-level=test

      - name: Install External App Connect and run tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --name odoo19-ci-connect \
            --network odoo19-ci \
            --volume "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            automatify-odoo19-ci \
            odoo \
            --database=odoo19_ci_connect \
            --without-demo=true \
            --http-interface=127.0.0.1 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --init=external_app_connect \
            --test-tags=/external_app_connect \
            --stop-after-init \
            --log-level=test

      - name: Install Inventify Inventory Connect and run tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --name odoo19-ci-inventify-connect \
            --network odoo19-ci \
            --volume "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            automatify-odoo19-ci \
            odoo \
            --database=odoo19_ci_inventify_connect \
            --without-demo=true \
            --http-interface=127.0.0.1 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --init=inventify_inventory_connect \
            --test-tags=/inventify_inventory_connect \
            --stop-after-init \
            --log-level=test

      - name: Install Social Publisher core and run tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --name odoo19-ci-social-core \
            --network odoo19-ci \
            --volume "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            automatify-odoo19-ci \
            odoo \
            --database=odoo19_ci_social_core \
            --without-demo=true \
            --http-interface=127.0.0.1 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --init=automatify_social \
            --test-tags=/automatify_social \
            --stop-after-init \
            --log-level=test

      - name: Install Social Publisher LinkedIn and run tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --name odoo19-ci-social-linkedin \
            --network odoo19-ci \
            --volume "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            automatify-odoo19-ci \
            odoo \
            --database=odoo19_ci_social_linkedin \
            --without-demo=true \
            --http-interface=127.0.0.1 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --init=automatify_social_linkedin \
            --test-tags=/automatify_social_linkedin \
            --stop-after-init \
            --log-level=test

      - name: Install Social Publisher X and run tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --name odoo19-ci-social-x \
            --network odoo19-ci \
            --volume "$GITHUB_WORKSPACE:/mnt/extra-addons:ro" \
            automatify-odoo19-ci \
            odoo \
            --database=odoo19_ci_social_x \
            --without-demo=true \
            --http-interface=127.0.0.1 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            --init=automatify_social_x \
            --test-tags=/automatify_social_x \
            --stop-after-init \
            --log-level=test

      - name: Show database logs on failure
        if: failure()
        run: docker logs db || true

      - name: Clean up
        if: always()
        run: |
          docker rm --force db 2>/dev/null || true
          docker network rm odoo19-ci 2>/dev/null || true
